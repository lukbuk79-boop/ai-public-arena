<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Public Aréna</title>
    <link rel="manifest" href="manifest.json">
    <meta name="author" content="Lukáš Buchvald">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0d0d0d; font-family: sans-serif; }
        iframe { border: none; width: 100vw; height: 100vh; display: block; opacity: 0; transition: opacity 0.5s ease; }
        
        /* Styly pro načítací obrazovku */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff4b4b;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255, 75, 75, 0.2);
            border-top: 4px solid #ff4b4b;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hidden { opacity: 0 !important; pointer-events: none; }
    </style>
</head>
<body>
    <!-- Načítací obrazovka -->
    <div id="loader">
        <div class="spinner"></div>
        <div>Probouzím Arénu...</div>
    </div>

    <!-- Streamlit Backend -->
    <iframe id="arena-frame" src="https://ai-public-arena.streamlit.app/?embed=true" allow="clipboard-write"></iframe>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        // Skrytí loaderu, jakmile se iframe načte
        const iframe = document.getElementById('arena-frame');
        const loader = document.getElementById('loader');
        
        iframe.onload = function() {
            iframe.style.opacity = '1';
            loader.classList.add('hidden');
        };
    </script>

    <!-- Cloudflare Web Analytics -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "1e40ef6c531343e28aaed743e2519fa9"}'></script>
    <!-- End Cloudflare Web Analytics -->
</body>
</html>
